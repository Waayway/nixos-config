[package]
name = "fleet-server"
version.workspace = true
edition.workspace = true

[lib]
name = "fleet_server"
path = "src/lib.rs"

[[bin]]
name = "fleet-server"
path = "src/main.rs"

[dependencies]
fleet-proto = { path = "../fleet-proto" }
fleet-migration = { path = "migration" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process"] }

[dev-dependencies]
tempfile = "3"
