[package]
name = "fleet-server"
version.workspace = true
edition.workspace = true

[lib]
name = "fleet_server"
path = "src/lib.rs"

[[bin]]
name = "fleet-server"
path = "src/main.rs"

[dependencies]
fleet-proto = { path = "../fleet-proto" }
fleet-migration = { path = "migration" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "signal", "sync"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
