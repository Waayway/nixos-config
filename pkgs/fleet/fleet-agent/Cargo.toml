[package]
name = "fleet-agent"
version.workspace = true
edition.workspace = true

[lib]
name = "fleet_agent"
path = "src/lib.rs"

[[bin]]
name = "fleet-agent"
path = "src/main.rs"

[dependencies]
fleet-proto = { path = "../fleet-proto" }
anyhow = "1"
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
