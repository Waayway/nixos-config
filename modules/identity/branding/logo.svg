<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- vanwaaij.com monogram in Lodestar's mark: a disc in ink (#17233d, or the night
       watch's #ebe3cd in dark mode) with "vw" in the serif italic of its wordmark, in
       the paper colour. -->
  <style>
    .mark { color: #17233d; }
    .ink { fill: #f3eee1; }
    @media (prefers-color-scheme: dark) {
      .mark { color: #ebe3cd; }
      .ink { fill: #0e1626; }
    }
  </style>
  <g class="mark">
    <circle cx="32" cy="32" r="32" fill="currentColor"/>
    <text class="ink" x="31" y="41" text-anchor="middle" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" font-weight="600" letter-spacing="0.5">vw</text>
  </g>
</svg>
