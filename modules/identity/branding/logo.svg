<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- vanwaaij.com monogram: a rounded square in the foreground colour (zinc-900, or
       zinc-50 in dark mode) with "vw" in the background colour. -->
  <style>
    .mark { color: #18181b; }
    .ink { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .mark { color: #fafafa; }
      .ink { fill: #18181b; }
    }
  </style>
  <g class="mark">
    <rect width="64" height="64" rx="14" fill="currentColor"/>
    <text class="ink" x="32" y="41" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="-1">vw</text>
  </g>
</svg>
