# hyprlock. https://wiki.hypr.land/hypr-ecosystem/hyprlock/
# Colours: Tokyo Night from tools/color.nix (theme_home.nix generates the file).
source = ~/.config/theme/colors.conf

$accent = $blue
$font = JetBrainsMono Nerd Font

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
    }
}

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb($bg)
    blur_passes = 0
}

# Layout
label {
    monitor =
    text = Layout: $LAYOUT
    color = rgb($fg)
    font_size = 25
    font_family = $font
    position = 30, -30
    halign = left
    valign = top
}

# Time
label {
    monitor =
    text = $TIME
    color = rgb($fg)
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# Date
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = rgb($fg)
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# Fingerprint
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb($fg)
    font_size = 14
    font_family = $font
    position = 0, -107
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb($accent)
    inner_color = rgb($bg_highlight)
    font_color = rgb($fg)
    fade_on_empty = false
    placeholder_text = <span foreground="##$fg_dark"><i>󰌾 Logged in as </i><span foreground="##$accent">$USER</span></span>
    hide_input = false
    check_color = rgb($accent)
    fail_color = rgb($red)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb($yellow)
    position = 0, -47
    halign = center
    valign = center
}
