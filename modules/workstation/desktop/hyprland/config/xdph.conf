# xdg-desktop-portal-hyprland (screen sharing). Read when the portal starts:
# `systemctl --user restart xdg-desktop-portal-hyprland` after a change.
screencopy {
    # The Quickshell picker (quickshell/quickshell_home.nix, config/share/SharePicker.qml)
    # instead of hyprland-share-picker; found on PATH.
    custom_picker_binary = quickshell-share-picker
    # "Remember for this app" starts ticked: apps may restore the choice without asking.
    allow_token_by_default = true
}
