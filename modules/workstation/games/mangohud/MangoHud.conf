### ~/.config/MangoHud/MangoHud.conf
### Base file: only preset order + keybinds live here.
### All layout and styling is in presets.conf so each preset is self-contained.

# Order to cycle through. The first one is what you see at launch.
#   1 = compact top bar   2 = full detail (per core + display/session)   0 = off
preset=1,2,0

# Keybinds
toggle_preset=Shift_R+F10
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4

# Logging (Shift_L+F2 to start/stop)
output_folder=/home/waayway/mangologs
log_duration=0
