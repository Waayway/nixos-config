### ~/.config/MangoHud/presets.conf
### Tuned for: AMD GPU, gamescope 4K/144 Hz via ScopeBuddy (--mangoapp)
###
### NOTE: keep each [preset N] header alone on its line - MangoHud ignores
###       a header with anything after it and falls back to its built-in presets.
###
### Colour key (same in every preset):
###   CPU  blue    GPU  green    RAM  pink    VRAM  purple
###   Session/Wine orange       Frametime  light green
### Load values turn amber above 60 % and red above 90 %.
### FPS turns red below 30, amber below 60, green above.

# ───────────────────────────────────────────────────────────
# Off
[preset 0]
no_display


# ───────────────────────────────────────────────────────────
# Compact top bar (Steam Deck style)
[preset 1]
legacy_layout=0
horizontal
horizontal_stretch=0
position=top-center
hud_no_margin
table_columns=20
font_size=22
round_corners=10
background_alpha=0.55
background_color=0B0E14
text_color=E6E6E6
text_outline=1
text_outline_thickness=1.5

cpu_color=4FA3E0
gpu_color=5FC27E
ram_color=D47FB0
vram_color=B07CE0
frametime_color=7CD67C

cpu_load_change
cpu_load_value=60,90
cpu_load_color=E6E6E6,FFB347,FF5C5C
gpu_load_change
gpu_load_value=60,90
gpu_load_color=E6E6E6,FFB347,FF5C5C
fps_color_change
fps_value=30,60
fps_color=FF5C5C,FFB347,7CD67C

# Shown left → right in this order
fps
frametime=0
frame_timing=0
cpu_stats
cpu_temp
gpu_stats
gpu_temp
ram
vram


# ───────────────────────────────────────────────────────────
# Full detail: per core, temps, display & session
[preset 2]
legacy_layout=0
position=top-left
table_columns=3
font_size=22
# Session/display rows use the "text" font; goverlay leaves it tiny
font_size_text=20
round_corners=10
background_alpha=0.6
background_color=0B0E14
text_color=E6E6E6
text_outline=1
text_outline_thickness=1.5

cpu_color=4FA3E0
gpu_color=5FC27E
ram_color=D47FB0
vram_color=B07CE0
io_color=A0A0E0
engine_color=F07A5A
wine_color=F07A5A
frametime_color=7CD67C

cpu_load_change
cpu_load_value=60,90
cpu_load_color=E6E6E6,FFB347,FF5C5C
gpu_load_change
gpu_load_value=60,90
gpu_load_color=E6E6E6,FFB347,FF5C5C
fps_color_change
fps_value=30,60
fps_color=FF5C5C,FFB347,7CD67C

# ── Frames ──
fps
fps_metrics=avg,0.01,0.001
show_fps_limit
frametime
frame_timing=1
present_mode

# ── GPU (AMD extras: junction / VRAM temp, voltage, fan, throttling) ──
gpu_name
gpu_stats
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_voltage
gpu_fan
throttling_status
vram

# ── CPU, per core ──
cpu_stats
cpu_temp
cpu_power
cpu_mhz
# 24 threads as one compact row of bars instead of 24 text rows.
# Want per-core MHz back? delete core_bars (adds ~24 lines).
core_load
core_bars

# ── Memory & disk ──
ram
swap
procmem
io_read
io_write

# ── Display (hdr / fsr / refresh_rate only report under gamescope) ──
resolution
refresh_rate
hdr
fsr
display_server

# ── Session ──
gamemode
vkbasalt
wine
winesync
engine_version
vulkan_driver
arch
battery
time
