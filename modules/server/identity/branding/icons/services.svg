<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Services (Lodestar's Services tab): its Lucide layout-grid icon in the paper
       colour on a rounded square in ink (#17233d, or the night watch's #ebe3cd in dark
       mode), the colours of logo.svg. -->
  <style>
    .mark { color: #17233d; }
    .ink { stroke: #f3eee1; }
    @media (prefers-color-scheme: dark) {
      .mark { color: #ebe3cd; }
      .ink { stroke: #0e1626; }
    }
  </style>
  <g class="mark">
    <rect width="64" height="64" rx="14" fill="currentColor"/>
    <g class="ink" transform="translate(14 14) scale(1.5)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="7" height="7" x="3" y="3" rx="1"/>
      <rect width="7" height="7" x="14" y="3" rx="1"/>
      <rect width="7" height="7" x="14" y="14" rx="1"/>
      <rect width="7" height="7" x="3" y="14" rx="1"/>
    </g>
  </g>
</svg>
