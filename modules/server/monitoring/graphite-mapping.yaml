# graphite_exporter mapping for TrueNAS SCALE's Graphite exporter (Reporting ->
# Exporters, `monitor`: destination 10.0.10.140:2003, prefix and namespace `truenas`,
# every 10 s). TrueNAS sends netdata paths `truenas.truenas.<chart>.<dimension>`; the
# names below were read off the wire during the rollout (2026-10-22). netdata exports
# every chart it has (per-unit cgroups, NFS ops, anomaly detection, ...): only the ones
# mapped here are kept, the last rule drops the rest. Pool space isn't in the export
# with a pool name; pool health comes from truenas-pools (exporters.nix).
#
# The file is JSON, which is valid YAML: exporters.nix reads it with builtins.fromJSON
# (dropping these comment lines) to set `mappingSettings`, which NixOS writes out as YAML.
{
  "mappings": [
    {
      "match": "truenas.truenas.truenas_disk_stats.*.*",
      "name": "truenas_disk_kibibytes_per_second",
      "labels": { "disk": "$1", "direction": "$2" }
    },
    {
      "match": "truenas.truenas.truenas_disk_stats.ops.*.*",
      "name": "truenas_disk_operations_per_second",
      "labels": { "disk": "$1", "operation": "$2" }
    },
    {
      "match": "truenas.truenas.truenas_disk_stats.busy.*.busy",
      "name": "truenas_disk_busy_milliseconds",
      "labels": { "disk": "$1" }
    },
    {
      "match": "truenas.truenas.truenas_arcstats.size.size",
      "name": "truenas_zfs_arc_size_bytes"
    },
    {
      "match": "truenas.truenas.truenas_arcstats.*.*",
      "name": "truenas_zfs_arcstats",
      "labels": { "stat": "$1", "dimension": "$2" }
    },
    {
      "match": "truenas.truenas.truenas_meminfo.*.*",
      "name": "truenas_memory_bytes",
      "labels": { "kind": "$1" }
    },
    {
      "match": "truenas.truenas.truenas_cpu_usage.cpu.*",
      "name": "truenas_cpu_usage_percent",
      "labels": { "cpu": "$1" }
    },
    {
      "match": "truenas.truenas.cputemp.temperatures.*",
      "name": "truenas_cpu_temperature_celsius",
      "labels": { "cpu": "$1" }
    },
    {
      "match": "truenas.truenas.net.*.*",
      "name": "truenas_network_kilobits_per_second",
      "labels": { "interface": "$1", "direction": "$2" }
    },
    {
      "match": ".+",
      "match_type": "regex",
      "action": "drop",
      "name": "dropped"
    }
  ]
}
